<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Indexing: driver portal is login-gated, keep out of search results -->
    <meta name="robots" content="noindex,nofollow" />
    <meta name="googlebot" content="noindex,nofollow" />

    <!-- Title / Description -->
    <title>
      Driver Portal | Digital Delivery — Accept Jobs, Track Routes & Earn
    </title>
    <meta
      name="description"
      content="The Digital Delivery Driver Portal lets approved couriers accept deliveries, navigate routes in real time, message dispatch, and track earnings across Nigeria and beyond."
    />
    <meta
      name="keywords"
      content="Digital Delivery driver, courier app Nigeria, delivery driver portal, dispatch rider Lagos, last-mile driver app, logistics driver platform"
    />
    <meta name="author" content="Digital Delivery" />
    <meta name="application-name" content="Digital Delivery Driver" />
    <meta name="apple-mobile-web-app-title" content="DD Driver" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Canonical -->
    <link rel="canonical" href="https://drivers.digitaldelivery.org/" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA manifest & theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Digital Delivery Driver Portal" />
    <meta
      property="og:title"
      content="Driver Portal | Digital Delivery — Accept Jobs, Track Routes & Earn"
    />
    <meta
      property="og:description"
      content="The Digital Delivery Driver Portal: accept deliveries, navigate routes in real time, message dispatch, and track your earnings."
    />
    <meta property="og:url" content="https://drivers.digitaldelivery.org/" />
    <meta
      property="og:image"
      content="https://drivers.digitaldelivery.org/logo.png"
    />
    <meta property="og:image:alt" content="Digital Delivery Driver Portal" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@digitaldeliveryng" />
    <meta
      name="twitter:title"
      content="Driver Portal | Digital Delivery"
    />
    <meta
      name="twitter:description"
      content="Accept deliveries, navigate routes in real time, message dispatch, and track your earnings — the Digital Delivery Driver Portal."
    />
    <meta
      name="twitter:image"
      content="https://drivers.digitaldelivery.org/logo.png"
    />

    <!-- Structured data: WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Digital Delivery Driver Portal",
        "alternateName": "DD Driver",
        "url": "https://drivers.digitaldelivery.org/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, iOS, Android",
        "browserRequirements": "Requires JavaScript and a modern browser with geolocation support.",
        "description": "Driver portal for Digital Delivery couriers to accept deliveries, track routes in real time, communicate with dispatch, and monitor earnings.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "NGN"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Digital Delivery",
          "url": "https://digitaldelivery.org/",
          "logo": "https://drivers.digitaldelivery.org/logo.png"
        }
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
